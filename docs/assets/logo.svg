<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fd4ea"/>
      <stop offset="50%" stop-color="#6fa8f5"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fe0f0"/>
      <stop offset="100%" stop-color="#00acd7"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c6f7"/>
      <stop offset="100%" stop-color="#3a6fd8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="320" height="320" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="317" height="317" rx="54.5" fill="none" stroke="#1c2740" stroke-width="1.5"/>

  <!-- badge ring -->
  <circle cx="160" cy="130" r="98" fill="#0e1626" stroke="url(#ring)" stroke-width="3" filter="url(#softShadow)"/>
  <circle cx="160" cy="130" r="98" fill="none" stroke="#0b1220" stroke-width="1" opacity="0.4"/>

  <!-- emblem: ticker -> concurrent fan-in -> settled task -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- clock / ticker -->
    <g transform="translate(112,130)" stroke="url(#cyanGrad)" stroke-width="4">
      <circle cx="0" cy="0" r="26"/>
      <path d="M0,0 L0,-15"/>
      <path d="M0,0 L12,8"/>
    </g>

    <!-- fan-in lines (concurrent executions joining) -->
    <g stroke="url(#blueGrad)" stroke-width="3.5">
      <path d="M 150 112 L 174 130"/>
      <path d="M 150 130 L 174 130"/>
      <path d="M 150 148 L 174 130"/>
    </g>

    <!-- settled task: circle with checkmark -->
    <g transform="translate(208,130)" stroke="url(#greenGrad)" stroke-width="4">
      <circle cx="0" cy="0" r="26"/>
      <path d="M-11,1 L-3,10 L13,-9"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="160" y="255" text-anchor="middle" fill="#f3f6fb" font-size="30" font-weight="800" letter-spacing="1">GO-WORKERS</text>
  <text x="160" y="280" text-anchor="middle" fill="#8b9bc2" font-size="14" font-weight="600" letter-spacing="5">TASK RUNNER</text>
</svg>
